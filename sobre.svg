<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Terminal: Daniel Alves, desenvolvedor e data analyst na Nobrelar Homecenter, founder da NAV, estudante da UFC">
