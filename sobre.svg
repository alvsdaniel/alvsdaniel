<text x="30" y="70" class="p" style="animation-delay:0.40s">$</text><clipPath id="c0"><rect x="50" y="50" height="28" width="0" style="animation:typ0 0.50s steps(6) 0.40s forwards"/></clipPath><style>@keyframes typ0 { to { width: 70px; } }</style><text x="50" y="70" class="c" clip-path="url(#c0)">whoami</text><text x="30" y="100" class="o" style="animation-delay:1.15s">daniel alves</text><text x="30" y="130" class="p" style="animation-delay:1.70s">$</text><clipPath id="c2"><rect x="50" y="110" height="28" width="0" style="animation:typ2 0.78s steps(13) 1.70s forwards"/></clipPath><style>@keyframes typ2 { to { width: 147px; } }</style><text x="50" y="130" class="c" clip-path="url(#c2)">cat sobre.txt</text><text x="30" y="160" class="o" style="animation-delay:2.73s">Sou desenvolvedor e gosto de resolver problema de verdade, daqueles</text><text x="30" y="190" class="o" style="animation-delay:3.28s">que travam a operação. Meu trabalho é olhar pra uma empresa, achar</text><text x="30" y="220" class="o" style="animation-delay:3.83s">onde o tempo está indo embora e construir o sistema que devolve esse</text><text x="30" y="250" class="o" style="animation-delay:4.38s">tempo. Fora do código, lidero gente e processo.</text><text x="30" y="280" class="p" style="animation-delay:4.93s">$ <tspan class="cur">█</tspan></text>
